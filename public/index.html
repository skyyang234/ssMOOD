  <style>
/* ── Loading screen ── */
#ss-loader {
  position: fixed; inset: 0; z-index: 9999;
  background: #030d18;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.8s ease;
}
#ss-loader.done { opacity: 0; pointer-events: none; }
#loader-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
}
.loader-ui {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center;
}
.loader-logo-row {
  display: flex; align-items: center; gap: 14px;
  opacity: 0; transform: translateY(10px);
  animation: loaderFadeUp 0.8s cubic-bezier(0.22,1,0.36,1) forwards 0.4s;
}
.loader-wordmark {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 46px; font-weight: 200;
  color: rgba(210,230,255,0.92);
  letter-spacing: -1px;
}
.loader-wordmark strong { font-weight: 700; }
.loader-sub {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(100,155,205,0.50);
  margin-top: 16px;
  opacity: 0;
  animation: loaderFadeUp 0.7s ease forwards 1.6s;
}
.loader-bar-wrap {
  width: 200px; height: 1px;
  background: rgba(74,127,193,0.15);
  margin-top: 26px; overflow: hidden;
  opacity: 0;
  animation: loaderFadeUp 0.5s ease forwards 0.8s;
}
.loader-bar {
  height: 100%; width: 0;
  background: linear-gradient(90deg,transparent,#4a7fc1,#5aab8a,transparent);
  animation: loaderBarFill 2.0s ease forwards 1.0s;
}
@keyframes loaderFadeUp { to { opacity: 1; transform: translateY(0); } }
@keyframes loaderBarFill { to { width: 100%; } }
</style>
<script>
/* Loading canvas animation */
(function(){
  var c=document.getElementById('loader-canvas');
  var ctx=c.getContext('2d');
  var W,H,dots=[],t0=null,frameId=null;
  var COLS=[[74,127,193],[126,168,216],[90,171,138],[232,130,90],[184,92,92],[58,122,98],[160,110,194],[122,80,160],[200,168,64]];
  function resize(){
    W=c.width=window.innerWidth; H=c.height=window.innerHeight;
    dots=[];
    var n=Math.min(Math.round(W*H/24000),50);
    for(var i=0;i<n;i++){
      var col=COLS[i%COLS.length];
      dots.push({x:Math.random(),y:Math.random(),vx:(Math.random()-0.5)*0.0005,vy:(Math.random()-0.5)*0.0005,r:1.5+Math.random()*2.0,op:0.35+Math.random()*0.5,ph:Math.random()*Math.PI*2,sp:0.3+Math.random()*0.7,col:col});
    }
  }
  function frame(ts){
    if(!t0)t0=ts; var t=(ts-t0)/1000;
    ctx.clearRect(0,0,W,H);
    /* sparse grid — cheaper */
    ctx.strokeStyle='rgba(74,127,193,0.03)';ctx.lineWidth=1;
    for(var x=0;x<W;x+=120){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(var y=0;y<H;y+=120){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    /* positions in pixel space */
    var px=dots.map(function(d){return {x:d.x*W,y:d.y*H};});
    /* connections */
    for(var i=0;i<dots.length;i++){
      var d=dots[i];
      d.x+=d.vx;d.y+=d.vy;
      if(d.x<0)d.x=1;if(d.x>1)d.x=0;if(d.y<0)d.y=1;if(d.y>1)d.y=0;
      for(var j=i+1;j<dots.length;j++){
        var dx=px[i].x-px[j].x,dy=px[i].y-px[j].y,dd=Math.sqrt(dx*dx+dy*dy);
        if(dd>130)continue;
        var r=d.col[0],g=d.col[1],b=d.col[2];
        ctx.beginPath();ctx.moveTo(px[i].x,px[i].y);ctx.lineTo(px[j].x,px[j].y);
        ctx.strokeStyle='rgba('+r+','+g+','+b+','+((1-dd/130)*0.10)+')';ctx.lineWidth=0.5;ctx.stroke();
      }
      var pulse=0.8+0.2*Math.sin(t*d.sp+d.ph);
      var grd=ctx.createRadialGradient(px[i].x,px[i].y,0,px[i].x,px[i].y,d.r*7);
      grd.addColorStop(0,'rgba('+d.col[0]+','+d.col[1]+','+d.col[2]+','+(d.op*0.18)+')');
      grd.addColorStop(1,'rgba('+d.col[0]+','+d.col[1]+','+d.col[2]+',0)');
      ctx.beginPath();ctx.arc(px[i].x,px[i].y,d.r*7,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
      ctx.beginPath();ctx.arc(px[i].x,px[i].y,d.r*pulse,0,Math.PI*2);
      ctx.fillStyle='rgba('+d.col[0]+','+d.col[1]+','+d.col[2]+','+d.op+')';ctx.fill();
    }
    frameId=requestAnimationFrame(frame);
  }
  window.addEventListener('resize',resize);
  resize();frameId=requestAnimationFrame(frame);
  /* stop canvas on Vue mount to save resources */
  window.addEventListener('DOMContentLoaded',function(){
    setTimeout(function(){
      if(!document.getElementById('ss-loader')||document.getElementById('ss-loader').style.display==='none'){
        if(frameId)cancelAnimationFrame(frameId);
      }
    },4000);
  });
})();
</script>
