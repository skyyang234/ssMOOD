<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css">
    <!--  <script src="./ace.js"></script> -->
    <!-- 在 public/index.html 中引入 Plotly -->
    <!--  <script src="./plotly-latest.min.js"></script> -->
    <link rel="preload" as="image" href="/loading.gif" />
    <style>
        html, body {
            overflow-y: hidden; /* 隐藏垂直滚动条 */
            height: 100%; /* 确保页面高度占满整个视口 */
            width: 100%; /* 确保页面宽度占满整个视口 */
            margin: 0; /* 移除默认的外边距 */
            padding: 0; /* 移除默认的内边距 */
        }
    </style>

  </head>
  <body>
      <!-- 加载动画（在 Vue 挂载前显示） -->
  <div id="app-loading">
    <div class="ld-card">
      <!-- Logo 标志（与导航栏 logo-mark 同源） -->
      <div class="ld-logo">
        <svg class="ld-mark" viewBox="0 0 56 56" width="60" height="60">
          <path d="M10 30 C8 20,12 10,20 7 C26 4,34 4,40 8 C47 13,50 20,48 28 C46 35,42 40,38 43 C34 46,30 47,28 47 C26 47,22 46,18 43 C13 39,11 36,10 30Z"
                fill="none" stroke="rgb(93,116,162)" stroke-width="1.2" opacity="0.35"/>
          <path d="M20 22 C24 18,30 19,34 16" fill="none" stroke="rgb(93,116,162)" stroke-width="0.9" opacity="0.35"/>
          <circle cx="19" cy="19" r="5.5" fill="rgb(93,116,162)" opacity="0.20"/>
          <circle class="ld-dot ld-dot-1" cx="19" cy="19" r="3.2" fill="rgb(93,116,162)"/>
          <circle class="ld-dot ld-dot-2" cx="36" cy="16" r="2.6" fill="rgb(140,170,210)"/>
          <circle class="ld-dot ld-dot-3" cx="41" cy="30" r="2.8" fill="#c0614a"/>
          <circle class="ld-dot ld-dot-4" cx="28" cy="42" r="2.4" fill="#3a8a72"/>
          <circle class="ld-dot ld-dot-5" cx="16" cy="35" r="2.0" fill="#5aab8a"/>
          <circle class="ld-dot ld-dot-6" cx="30" cy="26" r="2.2" fill="#6652a8"/>
          <line x1="19" y1="19" x2="36" y2="16" stroke="rgb(93,116,162)" stroke-width="0.9" opacity="0.32"/>
          <line x1="19" y1="19" x2="16" y2="35" stroke="rgb(93,116,162)" stroke-width="0.9" opacity="0.22"/>
          <line x1="16" y1="35" x2="28" y2="42" stroke="#3a8a72" stroke-width="0.9" opacity="0.26"/>
          <line x1="41" y1="30" x2="28" y2="42" stroke="#c0614a" stroke-width="0.9" opacity="0.22"/>
          <line x1="30" y1="26" x2="19" y2="19" stroke="#6652a8" stroke-width="0.9" opacity="0.20"/>
        </svg>
        <span class="ld-ring"></span>
      </div>

      <div class="ld-brand">ssMOOD</div>
      <div class="ld-tagline">Spatial &amp; Single-cell Major Depression Omics Online Database</div>

      <!-- 不定长进度条 -->
      <div class="ld-bar"><span class="ld-bar-fill"></span></div>

      <div class="ld-hint">Initial load may take longer on first use.</div>
      <div class="ld-hint ld-hint-2">This may take a few seconds...</div>
    </div>
  </div>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
  <style>
#app-loading {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  font-family: 'IBM Plex Sans', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(93,116,162,0.10), transparent 60%),
    radial-gradient(900px 500px at 85% 110%, rgba(74,127,193,0.10), transparent 55%),
    #f6f8fc;
  /* 平滑退出（由 main.js 添加 .is-done 触发） */
  transition: opacity 0.45s ease, visibility 0.45s ease;
}
#app-loading.is-done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.ld-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: ld-rise 0.6s ease both;
}
@keyframes ld-rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Logo：呼吸 + 外圈旋转 ── */
.ld-logo {
  position: relative;
  width: 96px;
  height: 96px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
}
.ld-mark {
  animation: ld-breath 2.4s ease-in-out infinite;
}
@keyframes ld-breath {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.06); }
}
/* 旋转外圈（指示"进行中"） */
.ld-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(93, 116, 162, 0.14);
  border-top-color: rgb(93, 116, 162);
  animation: ld-rotate 1.1s linear infinite;
}
@keyframes ld-rotate {
  to { transform: rotate(360deg); }
}
/* 各数据点依次亮起，模拟"数据汇聚" */
.ld-dot { animation: ld-pulse 1.8s ease-in-out infinite; }
.ld-dot-1 { animation-delay: 0s;    }
.ld-dot-2 { animation-delay: 0.25s; }
.ld-dot-3 { animation-delay: 0.5s;  }
.ld-dot-4 { animation-delay: 0.75s; }
.ld-dot-5 { animation-delay: 1s;    }
.ld-dot-6 { animation-delay: 1.25s; }
@keyframes ld-pulse {
  0%, 100% { opacity: 0.35; }
  40%      { opacity: 1; }
}

/* ── 品牌字 ── */
.ld-brand {
  font-size: 34px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: #162844;
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  line-height: 1.2;
}
.ld-tagline {
  margin-top: 8px;
  font-size: 12.5px;
  letter-spacing: 0.06em;
  color: #8496b0;
}

/* ── 不定长进度条 ── */
.ld-bar {
  position: relative;
  width: 220px;
  height: 3px;
  margin: 26px 0 20px;
  border-radius: 999px;
  background: rgba(93, 116, 162, 0.15);
  overflow: hidden;
}
.ld-bar-fill {
  position: absolute;
  top: 0;
  left: 0;
  width: 40%;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(93,116,162,0.5), rgb(74,127,193));
  animation: ld-slide 1.4s ease-in-out infinite;
}
@keyframes ld-slide {
  0%        { left: -40%; }
  100%      { left: 100%; }
}

/* ── 提示文字 ── */
.ld-hint {
  font-size: 13px;
  color: #4a6080;
  margin-top: 2px;
}
.ld-hint-2 {
  font-size: 12px;
  color: #8496b0;
  margin-top: 4px;
  animation: ld-blink 1.6s ease-in-out infinite;
}
@keyframes ld-blink {
  0%, 100% { opacity: 0.55; }
  50%      { opacity: 1; }
}

/* 窄屏适配 */
@media (max-width: 480px) {
  .ld-brand { font-size: 26px; }
  .ld-tagline { max-width: 78vw; text-align: center; }
}

</style>

</html>
